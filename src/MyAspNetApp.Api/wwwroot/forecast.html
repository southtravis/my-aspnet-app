<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Forecast - MyAspNetApp</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;margin:40px;color:#333}
    table{border-collapse:collapse;width:100%;max-width:700px}
    th,td{border:1px solid #ddd;padding:8px;text-align:left}
    th{background:#f4f4f4}
  </style>
</head>
<body>
  <h1>Weather Forecast</h1>
  <p>Loads the forecast from the API and displays it.</p>
  <div id="content">
    <p>Loading...</p>
  </div>

  <script>
    async function loadForecast(){
      try{
        const res = await fetch('/weatherforecast');
        if(!res.ok) throw new Error('Network response was not ok');
        const data = await res.json();
        const container = document.getElementById('content');
        if(!Array.isArray(data) || data.length === 0){
          container.innerHTML = '<p>No forecast data available.</p>';
          return;
        }
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th>Date</th><th>Temp (C)</th><th>Temp (F)</th><th>Summary</th></tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        for(const item of data){
          const tr = document.createElement('tr');
          const date = new Date(item.date);
          tr.innerHTML = `
            <td>${date.toLocaleDateString()}</td>
            <td>${item.temperatureC}</td>
            <td>${item.temperatureF ?? (32 + Math.round(item.temperatureC/0.5556))}</td>
            <td>${item.summary ?? ''}</td>
          `;
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        container.innerHTML = '';
        container.appendChild(table);
      }catch(err){
        document.getElementById('content').innerHTML = '<p>Error loading forecast: '+err.message+'</p>';
      }
    }
    loadForecast();
  </script>
</body>
</html>
